<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750">
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="1100" height="750" fill="#ffffff"/>
<text x="30.0" y="42.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">One MRV2 step: the CPU queues work, and waits only in get_output()</text>
<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">execute_model and sample_tokens return at once  ·  durations are illustrative, not measured</text>
<text x="30.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">time runs left to right  ·  the main stream runs kernels in queue order  ·  the copy stream overlaps</text>
<rect x="20.0" y="118.0" width="1060.0" height="300.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="144.0" r="13" fill="#111827"/>
<text x="46.0" y="148.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="68.0" y="149.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">What runs where, in one step?</text>
<text x="68.0" y="168.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Three lanes: the thread that calls the runner, the GPU main stream, and the runner&#x27;s copy stream.</text>
<text x="46.0" y="211.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">caller thread</text>
<text x="46.0" y="227.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">engine core or worker</text>
<line x1="228.0" y1="243.0" x2="1060.0" y2="243.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 4"/>
<text x="46.0" y="273.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#059669" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">GPU main stream</text>
<text x="46.0" y="289.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">kernels in order</text>
<line x1="228.0" y1="305.0" x2="1060.0" y2="305.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 4"/>
<text x="46.0" y="335.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">GPU copy stream</text>
<text x="46.0" y="351.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">output_copy_stream</text>
<line x1="228.0" y1="367.0" x2="1060.0" y2="367.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="237.0" y="196.0" width="168.0" height="34.0" rx="4" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.3"/>
<text x="321.0" y="217.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">execute_model</text>
<rect x="407.0" y="202.0" width="58.0" height="22.0" rx="3" fill="#ffffff" fill-opacity="1.0" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="436.0" y="217.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">bitmask</text>
<rect x="467.0" y="196.0" width="168.0" height="34.0" rx="4" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.3"/>
<text x="551.0" y="217.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">sample_tokens</text>
<rect x="637.0" y="202.0" width="298.0" height="22.0" rx="3" fill="#ffffff" fill-opacity="1.0" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="786.0" y="217.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">free: next step</text>
<rect x="937.0" y="196.0" width="113.0" height="34.0" rx="4" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.3"/>
<text x="993.5" y="217.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">get_output()</text>
<rect x="387.0" y="258.0" width="298.0" height="34.0" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="536.0" y="279.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">forward pass</text>
<rect x="687.0" y="258.0" width="68.0" height="34.0" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="721.0" y="279.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">sampler</text>
<rect x="757.0" y="258.0" width="88.0" height="34.0" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="801.0" y="279.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">post_update</text>
<rect x="847.0" y="258.0" width="78.0" height="34.0" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="886.0" y="279.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">drafter</text>
<rect x="387.0" y="326.0" width="368.0" height="22.0" rx="3" fill="#ffffff" fill-opacity="1.0" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="571.0" y="341.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">waits for main stream</text>
<rect x="757.0" y="320.0" width="78.0" height="34.0" rx="4" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.3"/>
<text x="796.0" y="341.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">D2H copy</text>
<circle cx="836.0" cy="337.0" r="5" fill="#d97706"/>
<text x="766.0" y="384.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">copy_event.record</text>
<path d="M 841.0,337.0 L 944.0,337.0 L 944.0,232.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m0)"/>
<text x="952.0" y="279.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">synchronize()</text>
<rect x="20.0" y="440.0" width="1060.0" height="196.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="466.0" r="13" fill="#111827"/>
<text x="46.0" y="470.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="68.0" y="471.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Who calls get_output()?</text>
<text x="68.0" y="490.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">It depends on the executor; in both cases the engine core gets plain Python lists.</text>
<rect x="46.0" y="508.0" width="490.0" height="104.0" rx="8" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.5"/>
<text x="58.0" y="528.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">uni executor (TP = PP = DP = 1)</text>
<text x="58.0" y="546.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">sample_tokens -&gt; AsyncOutputFuture (no wait)</text>
<text x="58.0" y="561.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">engine core main thread, later:</text>
<text x="58.0" y="576.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  batch_queue.pop() -&gt; future.result()</text>
<text x="58.0" y="591.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  -&gt; AsyncOutput.get_output()</text>
<rect x="564.0" y="508.0" width="490.0" height="104.0" rx="8" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.5"/>
<text x="576.0" y="528.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">multiproc + async scheduling (output rank)</text>
<text x="576.0" y="546.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">worker main thread: handle_output()</text>
<text x="576.0" y="561.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  -&gt; async_output_queue (no wait)</text>
<text x="576.0" y="576.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">thread WorkerAsyncOutputCopy:</text>
<text x="576.0" y="591.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  get_output() -&gt; reply MessageQueue</text>
<text x="30.0" y="671.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
<rect x="97.3" y="660.0" width="14.0" height="14.0" rx="3" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/>
<text x="118.3" y="671.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">CPU work</text>
<rect x="200.3" y="660.0" width="14.0" height="14.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.4"/>
<text x="221.3" y="671.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">GPU kernels</text>
<rect x="315.7" y="660.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="336.7" y="671.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">copy to the CPU and its event</text>
<text x="30.0" y="700.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Dashed blocks: no work of this step (the engine core computes the bitmask; the caller is free for the next step).</text>
<text x="30.0" y="718.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The drafter runs only with speculative decoding. With async scheduling, step N+1 is queued before get_output() of step N.</text>
</svg>
