<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="828" viewBox="0 0 1100 828">
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="1100" height="828" fill="#ffffff"/>
<text x="30.0" y="42.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Prefill on one instance, decode on another</text>
<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">NixlConnector (pull)  ·  toy router from tests/  ·  one chat request with a 2,000-token prompt</text>
<text x="30.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">P: kv_role &quot;kv_producer&quot;, port 8100  ·  D: kv_role &quot;kv_consumer&quot;, port 8200  ·  router: port 8192</text>
<rect x="20.0" y="116.0" width="1060.0" height="380.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="142.0" r="13" fill="#111827"/>
<text x="46.0" y="146.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="68.0" y="147.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Who does what for one request?</text>
<text x="68.0" y="166.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The router runs the request twice: a 1-token prefill on P, then the real request on D with P&#x27;s KV.</text>
<rect x="46.0" y="228.0" width="316.0" height="186.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="58.0" y="248.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Router (not part of vLLM)</text>
<text x="58.0" y="266.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">1  receives POST /v1/chat/completions</text>
<text x="58.0" y="281.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">2  sends a copy to P: max_tokens 1,</text>
<text x="58.0" y="296.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   stream false, kv_transfer_params</text>
<text x="58.0" y="311.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   {do_remote_decode: true}</text>
<text x="58.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">4  sends the original body to D with</text>
<text x="58.0" y="341.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   P&#x27;s returned kv_transfer_params</text>
<text x="58.0" y="356.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">7  streams D&#x27;s answer to the client</text>
<rect x="392.0" y="228.0" width="316.0" height="186.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="404.0" y="248.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Prefill instance P</text>
<text x="404.0" y="266.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">3  computes the 2,000-token prompt,</text>
<text x="404.0" y="281.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   samples 1 token, finishes</text>
<text x="404.0" y="296.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   request_finished(): keep blocks</text>
<text x="404.0" y="311.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   (lease 30 s), return params:</text>
<text x="404.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   do_remote_prefill: true,</text>
<text x="404.0" y="341.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   remote_block_ids, remote_host,</text>
<text x="404.0" y="356.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   remote_port, remote_engine_id …</text>
<rect x="738.0" y="228.0" width="316.0" height="186.0" rx="8" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.5"/>
<text x="750.0" y="248.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#059669" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Decode instance D</text>
<text x="750.0" y="266.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">5  connector: (2000 tokens, async)</text>
<text x="750.0" y="281.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   → WAITING_FOR_REMOTE_KVS</text>
<text x="750.0" y="296.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   worker pulls the blocks (NIXL READ)</text>
<text x="750.0" y="311.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   and notifies P (P frees them)</text>
<text x="750.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">6  finished_recving → WAITING;</text>
<text x="750.0" y="341.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   recompute the last prompt token,</text>
<text x="750.0" y="356.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   sample, then decode as usual</text>
<line x1="362.0" y1="278.0" x2="390.0" y2="278.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="376.0" y="270.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<path d="M 550,414 L 550,438 L 204,438 L 204,416" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="222.0" y="454.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">3  response JSON carries kv_transfer_params</text>
<path d="M 300,228 L 300,206 L 896,206 L 896,226" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="560.0" y="200.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2563eb" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">4  request + P&#x27;s kv_transfer_params</text>
<line x1="708.0" y1="338.0" x2="736.0" y2="338.0" stroke="#db2777" stroke-width="2" marker-end="url(#m2)"/>
<line x1="738.0" y1="378.0" x2="710.0" y2="378.0" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m3)"/>
<rect x="20.0" y="518.0" width="1060.0" height="200.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="544.0" r="13" fill="#111827"/>
<text x="46.0" y="548.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="68.0" y="549.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">What states does the request pass on D?</text>
<text x="68.0" y="568.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The scheduler parks the request until the worker reports finished_recving, then schedules the rest.</text>
<rect x="46.0" y="594.0" width="140.0" height="30.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/>
<text x="116.0" y="613.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">WAITING</text>
<line x1="186.0" y1="609.0" x2="216.0" y2="609.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m4)"/>
<rect x="218.0" y="594.0" width="270.0" height="30.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="353.0" y="613.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">WAITING_FOR_REMOTE_KVS</text>
<line x1="488.0" y1="609.0" x2="518.0" y2="609.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#m1)"/>
<rect x="520.0" y="594.0" width="140.0" height="30.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/>
<text x="590.0" y="613.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">WAITING</text>
<line x1="660.0" y1="609.0" x2="690.0" y2="609.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m4)"/>
<rect x="692.0" y="594.0" width="140.0" height="30.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#059669" stroke-width="1.4"/>
<text x="762.0" y="613.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">RUNNING</text>
<text x="46.0" y="648.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#db2777" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">load failed + kv_load_failure_policy &quot;fail&quot; (default)  →  FINISHED_ERROR, the router sees an error</text>
<text x="46.0" y="670.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">load failed + &quot;recompute&quot;  →  num_computed_tokens cut at the first bad block; D prefills the rest itself</text>
<text x="46.0" y="692.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">P side: blocks stay until D&#x27;s read notification, or until the lease runs out without a heartbeat</text>
<text x="30.0" y="753.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
<rect x="97.3" y="742.0" width="14.0" height="14.0" rx="3" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/>
<text x="118.3" y="753.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">router / HTTP</text>
<rect x="226.8" y="742.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="247.8" y="753.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">prefill instance</text>
<rect x="361.7" y="742.0" width="14.0" height="14.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.4"/>
<text x="382.7" y="753.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">decode instance</text>
<rect x="498.6" y="742.0" width="14.0" height="14.0" rx="3" fill="#fdf2f8" fill-opacity="1.0" stroke="#db2777" stroke-width="1.4"/>
<text x="519.6" y="753.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">KV bytes (RDMA / NIXL)</text>
<text x="30.0" y="778.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Numbers are an example. The router in vLLM&#x27;s repo is a toy (tests/.../toy_proxy_server.py); production routers are</text>
<text x="30.0" y="796.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  external projects. The P instance&#x27;s 1 sampled token is discarded by the router.</text>
</svg>
