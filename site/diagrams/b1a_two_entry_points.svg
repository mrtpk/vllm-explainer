<text x="731.5" y="226.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">ZMQ</text>
<line x1="780.0" y1="276.0" x2="685.0" y2="276.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m2)"/>
