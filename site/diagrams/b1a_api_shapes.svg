<text x="58.0" y="577.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   &quot;message&quot;: {&quot;role&quot;: &quot;assistant&quot;,</text>
<text x="58.0" y="592.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">     &quot;content&quot;: &quot;Hello! How can ...&quot;},</text>
<text x="58.0" y="607.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   &quot;finish_reason&quot;: &quot;stop&quot;}],</text>
<text x="58.0" y="622.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre"> &quot;usage&quot;: {&quot;prompt_tokens&quot;: 13,</text>
<text x="58.0" y="637.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">   &quot;total_tokens&quot;: 23, ...}}</text>
<rect x="408.0" y="494.0" width="646.0" height="160.0" rx="8" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.5"/>
