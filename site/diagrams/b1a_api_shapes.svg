<text x="30.0" y="738.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Each SSE event ends with a blank line (not shown). The id, object, created and model fields are not shown.</text>
<text x="30.0" y="756.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The usage chunk comes only with stream_options.include_usage = true or --enable-force-include-usage.</text>
<text x="30.0" y="774.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Illustrative numbers: 13 prompt tokens (Qwen3 chat template, thinking off), 10 output tokens including the end token.</text>
