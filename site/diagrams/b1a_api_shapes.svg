<text x="420.0" y="547.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">data: {...&quot;choices&quot;:[{&quot;index&quot;:0,&quot;delta&quot;:{&quot;content&quot;:&quot;Hello&quot;},...}]}</text>
<text x="420.0" y="562.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">data: {...&quot;choices&quot;:[{&quot;index&quot;:0,&quot;delta&quot;:{&quot;content&quot;:&quot;!&quot;},...}]}</text>
<text x="420.0" y="577.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">...</text>
<text x="420.0" y="592.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">data: {...&quot;choices&quot;:[{&quot;index&quot;:0,&quot;delta&quot;:{&quot;content&quot;:&quot;&quot;},&quot;finish_reason&quot;:&quot;stop&quot;,...}]}</text>
<text x="420.0" y="607.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">data: {...&quot;choices&quot;:[],&quot;usage&quot;:{&quot;prompt_tokens&quot;:13,...,&quot;completion_tokens&quot;:10},...}</text>
<text x="420.0" y="622.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">data: [DONE]</text>
