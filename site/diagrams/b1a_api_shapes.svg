<text x="58.0" y="547.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre"> &quot;object&quot;: &quot;chat.completion&quot;,</text>
