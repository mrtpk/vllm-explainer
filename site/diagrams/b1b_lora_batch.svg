<line x1="712.0" y1="502.0" x2="728.0" y2="502.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="46.0" y="574.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">GPU slots (max_loras = 3): sql, chat-de, legal.   CPU cache (max_cpu_loras, default = max_loras): adapters waiting to move to the GPU.</text>
<text x="30.0" y="637.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
