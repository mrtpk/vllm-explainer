<line x1="390.0" y1="398.0" x2="530.0" y2="398.0" stroke="#059669" stroke-width="2"/>
<text x="540.0" y="402.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#059669" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">per-request time_to_first_token_ms (engine clock)</text>
