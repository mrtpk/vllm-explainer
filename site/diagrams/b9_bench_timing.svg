<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">vllm bench serve -&gt; POST /v1/completions (stream) -&gt; vllm serve  ·  schematic, not to scale</text>
<text x="30.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">client: time.perf_counter()  ·  API server: time.time()  ·  engine core: time.monotonic()</text>
<rect x="20.0" y="118.0" width="1060.0" height="350.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
